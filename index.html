*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#fff;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:12px;padding-bottom:90px}
.nav{display:flex;gap:5px;background:rgba(255,255,255,.06);border:0.5px solid rgba(255,255,255,.1);border-radius:16px;padding:5px;margin-bottom:16px}
.nb{flex:1;padding:8px 4px;border:none;background:transparent;border-radius:11px;cursor:pointer;font-size:11px;font-weight:600;color:rgba(255,255,255,.4);display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s}
.nb.active{background:rgba(255,255,255,.1);color:#fff}
.nav-av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
.panel{background:rgba(255,255,255,.05);border:0.5px solid rgba(255,255,255,.1);border-radius:18px;padding:16px;margin-bottom:12px}
.ph{display:flex;align-items:center;gap:12px}
.bav{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.pi h2{font-size:18px;font-weight:700}.pi p{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
.sb{margin-left:auto;text-align:center;background:rgba(255,165,0,.08);border:0.5px solid rgba(255,165,0,.25);border-radius:10px;padding:7px 12px}
.sn{font-size:18px;font-weight:800;color:#ffaa00}.sl{font-size:10px;color:rgba(255,255,255,.35)}
.sr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sc{background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.07);border-radius:12px;padding:10px;text-align:center}
.sv{font-size:20px;font-weight:800}.sl2{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px}
.cr{display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.07);border-radius:12px;margin-bottom:7px}
.ci{font-size:18px;flex-shrink:0}.cn{font-size:13px;font-weight:500;flex:1;line-height:1.3;color:rgba(255,255,255,.8)}
.yng{display:flex;gap:5px;flex-shrink:0}
.yb{width:44px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:transparent;cursor:pointer;font-size:12px;font-weight:700;color:rgba(255,255,255,.35);transition:all .12s}
.yb.yes.on{background:#1a5c1e;border-color:#2ecc40;color:#2ecc40}
.yb.no.on{background:#5c1a1a;border-color:#e74c3c;color:#e74c3c}
.sres{display:flex;align-items:center;gap:14px;padding:14px;background:rgba(255,255,255,.04);border:0.5px solid rgba(255,255,255,.07);border-radius:12px;margin:12px 0}
.sbig{font-size:36px;font-weight:900}
.sd p{font-size:14px;font-weight:700}.sd span{font-size:12px;color:rgba(255,255,255,.35)}
.btn{width:100%;padding:14px;border-radius:14px;border:none;cursor:pointer;font-size:15px;font-weight:800;color:white;letter-spacing:.02em;transition:all .15s}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn:not(:disabled):active{transform:scale(.98)}
.btn-sec{background:rgba(255,255,255,.07);color:rgba(255,255,255,.6);margin-top:8px;font-weight:600;font-size:14px}
.ae{text-align:center;padding:1.5rem;background:rgba(255,255,255,.03);border-radius:14px;color:rgba(255,255,255,.35)}
.bonus{background:rgba(255,150,0,.07);border:0.5px solid rgba(255,150,0,.25);border-radius:12px;padding:11px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:#ffaa44}
.stitle{font-size:11px;font-weight:700;color:rgba(255,255,255,.25);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}

/* ===== CARD DESIGNS ===== */
.the-card{width:230px;height:325px;border-radius:18px;position:relative;display:flex;flex-direction:column;overflow:hidden;transition:transform .3s}
.the-card:active{transform:scale(.97)}
.card-inner{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:13px}
.card-shine{position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:1}
.shimmer-sweep{position:absolute;inset:0;border-radius:16px;pointer-events:none;z-index:3;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.07) 50%,transparent 65%);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.tier-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;align-self:flex-start;margin-bottom:9px}
.card-name{font-size:20px;font-weight:900;line-height:1.05;letter-spacing:-.02em;margin-bottom:3px}
.card-subtitle{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px;opacity:.7}
.card-divider{height:1px;width:100%;margin-bottom:9px;opacity:.5}
.card-power{font-size:11px;font-weight:600;line-height:1.45;flex:1;padding-bottom:8px}
.stats-row{display:flex;gap:5px;margin-bottom:7px}
.stat-box{flex:1;text-align:center;padding:5px 2px;border-radius:8px}
.stat-lbl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;opacity:.55}
.stat-val{font-size:16px;font-weight:900}
.card-flavor{font-size:9px;font-style:italic;line-height:1.45;text-align:center;padding-top:6px;border-top:1px solid rgba(255,255,255,.07);opacity:.6}
.card-theme-icon{position:absolute;top:12px;right:12px;font-size:16px;opacity:.4;z-index:2}

.card-bronce{background:linear-gradient(160deg,#1e0f06,#3a2010,#1e0f06);border:2px solid #a0622a}
.card-bronce .card-shine{background:linear-gradient(135deg,rgba(180,100,40,.12) 0%,transparent 55%)}
.card-bronce .tier-badge{background:rgba(160,98,42,.25);border:1px solid #c8844a;color:#ffd4a0}
.card-bronce .card-name{color:#ffd4a0;text-shadow:0 0 18px rgba(200,120,60,.5)}
.card-bronce .card-subtitle{color:#e8b080}
.card-bronce .card-divider{background:linear-gradient(90deg,transparent,#a0622a,transparent)}
.card-bronce .stat-box{background:rgba(160,98,42,.15);border:1px solid rgba(160,98,42,.3)}
.card-bronce .stat-val,.card-bronce .stat-lbl{color:#ffd4a0}
.card-bronce .card-power{color:#f0c090}
.card-bronce .card-flavor{color:#d4a070}

.card-plata{background:linear-gradient(160deg,#0e121a,#18222e,#0e121a);border:2px solid #6a8faa}
.card-plata .card-shine{background:linear-gradient(135deg,rgba(140,180,210,.1) 0%,transparent 55%)}
.card-plata .tier-badge{background:rgba(106,143,170,.2);border:1px solid #8aadcc;color:#c8e8ff}
.card-plata .card-name{color:#c8e8ff;text-shadow:0 0 18px rgba(100,160,210,.5)}
.card-plata .card-subtitle{color:#a0c0de}
.card-plata .card-divider{background:linear-gradient(90deg,transparent,#6a8faa,transparent)}
.card-plata .stat-box{background:rgba(106,143,170,.12);border:1px solid rgba(106,143,170,.28)}
.card-plata .stat-val,.card-plata .stat-lbl{color:#c8e8ff}
.card-plata .card-power{color:#b0d0ee}
.card-plata .card-flavor{color:#90b0cc}

.card-oro{background:linear-gradient(160deg,#120e00,#22180a,#120e00);border:2px solid #c9a227}
.card-oro .card-shine{background:linear-gradient(135deg,rgba(255,210,0,.15) 0%,transparent 45%)}
.card-oro .tier-badge{background:rgba(201,162,39,.18);border:1px solid #ffd84a;color:#fff5b0}
.card-oro .card-name{color:#ffe566;text-shadow:0 0 22px rgba(255,210,0,.7),0 0 40px rgba(255,180,0,.3)}
.card-oro .card-subtitle{color:#d4b840}
.card-oro .card-divider{background:linear-gradient(90deg,transparent,#c9a227,transparent)}
.card-oro .stat-box{background:rgba(201,162,39,.12);border:1px solid rgba(201,162,39,.32)}
.card-oro .stat-val,.card-oro .stat-lbl{color:#ffe566}
.card-oro .card-power{color:#f8d860}
.card-oro .card-flavor{color:#c8a830}
.card-oro::after{content:'';position:absolute;inset:-1px;border-radius:18px;box-shadow:0 0 18px rgba(255,200,0,.12),inset 0 0 12px rgba(255,200,0,.04);pointer-events:none;z-index:0}

.card-diamante{background:linear-gradient(160deg,#001828,#002438,#001828);border:2px solid #00c8e8}
.card-diamante .card-shine{background:linear-gradient(135deg,rgba(0,210,255,.14) 0%,transparent 45%)}
.card-diamante .tier-badge{background:rgba(0,200,232,.15);border:1px solid #22d3ee;color:#90f0ff}
.card-diamante .card-name{color:#90f0ff;text-shadow:0 0 24px rgba(0,210,255,.9),0 0 50px rgba(0,180,230,.3)}
.card-diamante .card-subtitle{color:#40c8e0}
.card-diamante .card-divider{background:linear-gradient(90deg,transparent,#00c8e8,transparent)}

.card-diamante .stat-val,.card-diamante .stat-lbl{color:#90f0ff}
.card-diamante .card-power{color:#70e0f8}
.card-diamante .card-flavor{color:#38b8d8}
.card-diamante::after{content:'';position:absolute;inset:-1px;border-radius:18px;box-shadow:0 0 22px rgba(0,210,255,.18),inset 0 0 16px rgba(0,210,255,.06);pointer-events:none;z-index:0}

.card-platino{background:linear-gradient(160deg,#120020,#1e0038,#120020);border:2px solid #c030e8}
.card-platino .card-shine{background:linear-gradient(135deg,rgba(200,60,255,.18) 0%,rgba(100,60,255,.08) 35%,transparent 55%)}
.card-platino .tier-badge{background:rgba(192,48,232,.18);border:1px solid #d946ef;color:#f0c0ff}
.card-platino .card-name{color:#f0c0ff;text-shadow:0 0 28px rgba(200,80,255,1),0 0 55px rgba(180,50,240,.4)}
.card-platino .card-subtitle{color:#c060e0}
.card-platino .card-divider{background:linear-gradient(90deg,transparent,#c030e8,transparent)}
.card-platino .stat-box{background:rgba(192,48,232,.12);border:1px solid rgba(192,48,232,.32)}
.card-platino .stat-val,.card-platino .stat-lbl{color:#f0c0ff}
.card-platino .card-power{color:#e090f8}
.card-platino .card-flavor{color:#b050d0}
.card-platino::after{content:'';position:absolute;inset:-1px;border-radius:18px;pointer-events:none;z-index:0;animation:platglow 2s ease-in-out infinite alternate}
@keyframes platglow{from{box-shadow:0 0 20px rgba(180,40,240,.22),inset 0 0 14px rgba(180,40,240,.06)}to{box-shadow:0 0 38px rgba(200,60,255,.42),0 0 65px rgba(180,40,240,.14),inset 0 0 24px rgba(200,60,255,.1)}}

.card-back{width:230px;height:325px;border-radius:18px;background:linear-gradient(160deg,#0c0c18,#141428,#0c0c18);border:2px solid rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s}
.card-back:active{transform:scale(.97)}
.card-back::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent,transparent 12px,rgba(255,255,255,.012) 12px,rgba(255,255,255,.012) 13px)}
.back-emoji{font-size:64px;filter:drop-shadow(0 0 20px rgba(255,255,255,.25));position:relative;z-index:1}
.back-lbl{font-size:11px;color:rgba(255,255,255,.2);letter-spacing:.15em;text-transform:uppercase;position:relative;z-index:1}

.card-info{text-align:center;padding:0 8px}
.ci-name{font-size:18px;font-weight:800}
.ci-desc{font-size:12px;color:rgba(255,255,255,.35);margin-top:3px}
.ci-theme{font-size:11px;color:rgba(255,255,255,.25);margin-top:4px}
.ci-prompt{margin-top:10px;background:rgba(255,255,255,.05);border:0.5px solid rgba(255,255,255,.1);border-radius:10px;padding:10px}
.ci-prompt p{font-size:10px;color:rgba(255,255,255,.35);margin-bottom:5px}
.ci-prompt code{font-size:10px;color:#7dd3fc;font-family:monospace;line-height:1.5;display:block;word-break:break-all}

.cgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cc-item{border-radius:12px;border:1.5px solid;overflow:hidden;transition:transform .15s}
.cc-item:active{transform:scale(.97)}
.cc-art{height:75px;display:flex;align-items:center;justify-content:center;padding:8px;background:rgba(0,0,0,.25)}
.cc-art-inner{text-align:center}
.cc-art-emoji{font-size:20px;margin-bottom:3px}
.cc-art-name{font-size:10px;font-weight:800;line-height:1.2}
.cc-info{padding:7px 9px;background:rgba(0,0,0,.35)}
.cc-tier{font-size:11px;font-weight:800}
.cc-sub{font-size:10px;opacity:.55;margin-top:1px}
.cc-date{font-size:9px;opacity:.35;margin-top:2px}
.empty{text-align:center;padding:2rem;color:rgba(255,255,255,.2);font-size:13px}
</style>
</head>

function getTier(s){return TIERS[Math.max(0,Math.min(5,s))];}
function getState(){try{return JSON.parse(localStorage.getItem('fcards9')||'{}');}catch(e){return {};}}
function setState(s){try{localStorage.setItem('fcards9',JSON.stringify(s));}catch(e){}}
function getKS(id){const s=getState();if(!s[id])s[id]={collection:[],streak:0,maxStreak:0,totalPoints:0,evals:{}};return s[id];}
function saveKS(id,ks){const s=getState();s[id]=ks;setState(s);}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function streakBonus(n){if(n>=14)return '¡14 días perfectos! 🏅';if(n>=7)return '¡7 días seguidos! 🔥';return null;}

function pickTheme(kid, score){
  // Higher score = more chance of favourite theme
  const boost = score >= 4 ? 20 : score >= 3 ? 10 : 0;
  const weights = kid.themeWeights.map((w,i)=> i===0 ? w+boost : Math.max(5,w-boost));
  const total = weights.reduce((a,b)=>a+b,0);
  let r = Math.random()*total;
  for(let i=0;i<weights.length;i++){r-=weights[i];if(r<=0)return kid.themes[i];}
  return kid.themes[0];
}

function pickCard(theme, score){
  const pool = CARDS[theme]?.[score];
  if(!pool||!pool.length) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

const THEME_LABELS={futbol:'⚽ Fútbol Mundial 2026',realmadrid:'🤍 Real Madrid',sonic:'🦔 Sonic the Hedgehog',polican:'🐾 Policán',huntrix:'🩸 K-Pop Demon Hunters',princesas:'👸 Princesas Disney'};

  curKid=id;renderNav();

function renderKid(kidId){
  const kid=KIDS.find(k=>k.id===kidId),ks=getKS(kidId);

function renderEval(kidId){
  const kid=KIDS.find(k=>k.id===kidId),ks=getKS(kidId);
  const area=document.getElementById('ea-'+kidId);
  if(!area)return;

  if(pending?.kidId===kidId&&revealCard){renderReveal(kidId,area);return;}

  const tk=todayKey();
  if(ks.evals[tk]){
    const t=getTier(ks.evals[tk].score);
    area.innerHTML=`<div class="ae"><div style="font-size:32px;margin-bottom:8px">${t.emoji}</div><p style="font-weight:700;font-size:15px;color:white">Ya evaluaste hoy a ${kid.name}</p><p style="margin-top:5px">${ks.evals[tk].score}/5 — ${t.name}</p><p style="margin-top:10px;font-size:11px">Vuelve mañana 🌙</p></div>`;
    return;
  }

  const a=ans[kidId]||{},score=CRITERIA.reduce((s,c)=>s+(a[c.id]===true?1:0),0);
  const allDone=CRITERIA.every(c=>a[c.id]!==undefined),tier=getTier(score);
  const bonus=streakBonus(ks.streak+1);
  const dateStr=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});

  area.innerHTML=`
    ${bonus?`<div class="bonus">🔥 ${bonus}</div>`:''}
    <p class="stitle">${dateStr}</p>
    ${CRITERIA.map(c=>`
      <div class="cr">
        <div class="ci">${c.icon}</div><div class="cn">${c.label}</div>
        <div class="yng">
          <button class="yb yes ${a[c.id]===true?'on':''}" onclick="setAns('${kidId}','${c.id}',true)">Sí</button>
          <button class="yb no ${a[c.id]===false?'on':''}" onclick="setAns('${kidId}','${c.id}',false)">No</button>
        </div>
      </div>`).join('')}
    <div class="sres">
      <div class="sbig" style="color:${tier.color}">${score}/5</div>
      <div class="sd"><p style="color:${tier.color}">${tier.name} ${tier.emoji}</p><span>${allDone?tier.desc:'Responde todas las preguntas'}</span></div>
    </div>
    ${score===0&&allDone
      ?`<div class="ae" style="padding:1rem">Sin puntuación hoy. ¡Mañana mejor! 💪</div>`
      :`<button class="btn" style="background:${kid.grad}" ${!allDone?'disabled':''} onclick="genCard('${kidId}',${score})">
          ${allDone?`✨ Obtener carta de ${kid.name}`:'Responde todas las preguntas'}
        </button>`
    }`;
}

function setAns(kidId,cid,val){
  if(!ans[kidId])ans[kidId]={};
  ans[kidId][cid]=val;
  renderKid(kidId);
}

function genCard(kidId,score){
  const kid=KIDS.find(k=>k.id===kidId);
  const theme=pickTheme(kid,score);
  const card=pickCard(theme,score);
  if(!card){renderKid(kidId);return;}
  // Apply streak bonus — upgrade tier visually if 7+ days
  const ks=getKS(kidId);
  const effectiveScore=streakBonus(ks.streak+1)&&score===5?5:score;
  pending={kidId,score:effectiveScore,theme};
  revealCard={...card,theme};
  revealed[kidId]=false;
  renderKid(kidId);
}

    'Policán y el Jefe Unidos':'a cartoon dog-hero and a grumpy police chief standing back to back, ready for action, confident poses',
    // HUNTRIX
    'Zoe':'a short petite young Asian woman with big eyes, dark hair, conflicted expression, dark fantasy armor with purple accents',
    'Baby Saja':'a very young teenage boy in stylish K-pop outfit, innocent face, soft features, ethereal dark glow',
    'Mira':'a tall elegant young Asian woman with long dark hair, powerful pose, dark fantasy warrior outfit',
    'Romance Saja':'a handsome young Asian man with soft features, charming smile, stylish dark K-pop outfit, charismatic aura',
    'Soy':'a calm composed young Asian woman with short hair, serene battle expression, dark armor, fighting stance',
    'Mystery Saja':'a mysterious young Asian man with dark hair covering one eye, enigmatic expression, dramatic shadow lighting',
    'Abby Saja':'an athletic muscular young Asian man with intense eyes, dynamic action pose, dark stylish outfit',
    'Jinu Saja':'a tall commanding young Asian man with sharp features, dark regal outfit, glowing supernatural eyes, leader aura',
    'Seraphina la Caída':'a woman with torn dark wings, white hair, glowing violet eyes, half angel half demon aesthetic, dramatic pose',
    'Rumy':'a young Asian woman with long dark hair, microphone in hand, battle dancer pose, K-pop star meets demon hunter',
    'Las Guerreras Unidas':'four young Asian women warriors in dark fantasy K-pop outfits standing in a powerful group formation',
    // PRINCESAS
    'Cenicienta':'a elegant young woman in a blue ballgown with golden details, blonde hair up, glass slipper visible, magical sparkles',
    'Aurora':'a beautiful young woman with long wavy blonde hair, pink and blue dress, sleeping beauty dreamlike soft lighting',
    'Ariel':'a young woman with long flowing red hair underwater, green mermaid tail, wide curious blue eyes, coral reef background',
    'Rapunzel':'a young woman with extremely long blonde hair wrapped around her, big green eyes, purple dress, glowing lanterns background',
    'Tiana':'a young Black woman with dark hair, green lily pad dress, warm smile, New Orleans bayou background with fireflies',
    'Bella':'a young woman with brown hair in a half-updo, golden ballgown, intelligent warm eyes, enchanted library background',
    'Mérida':'a young Scottish woman with wild curly red hair, green medieval dress, holding a bow and arrow, highland misty background',
    'Moana':'a young Polynesian woman with long wavy dark hair, red and white island dress, ocean waves behind her, confident pose',
    'Elsa':'a young woman with long platinum blonde braid, ice blue dress with snowflake details, hands creating ice magic, frozen palace',
    'Mulan':'a young Chinese woman in red and gold warrior armor, black hair, sword in hand, Great Wall of China background',
    'Vaiana':'a young Polynesian woman with long wavy dark hair, red and white dress, heart-shaped green stone necklace, glowing ocean',
    'Las Princesas Unidas':'a group of diverse princess characters in their iconic outfits, standing together in a magical glowing composition'
  };

  const visualDesc=cardVisuals[card.name]||'a heroic fantasy character in dynamic battle pose, dramatic lighting';
  const geminiPrompt=`Collectible trading card art illustration. ${visualDesc}. Style: ${frameStyle}, dramatic cinematic lighting, dark rich background, highly detailed digital painting, vibrant colors, character in foreground, no text, no letters, no words, square format 1:1.`;

  area.innerHTML=`
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:8px 0 16px">
      ${isRev
        ?`${buildCardHTML(card,tier)}
          <div class="card-info">
            <div class="ci-name" style="color:${tier.color}">${tier.name} — ${pending.score}/5</div>
            <div class="ci-desc">${tier.desc}</div>
            <div class="ci-theme">${themeLabel}</div>
            <div class="ci-prompt">
              <p>Prompt para Gemini (cópialo):</p>
              <code id="gprompt-${kidId}">${geminiPrompt}</code>
              <button onclick="copyGeminiPrompt('${kidId}')" style="width:100%;margin-top:6px;padding:7px;border-radius:7px;border:none;background:rgba(255,255,255,.08);color:white;font-size:12px;font-weight:700;cursor:pointer">📋 Copiar prompt</button>
            </div>
            <div style="margin-top:10px">
              <p style="font-size:11px;color:rgba(255,255,255,.3);margin-bottom:6px">¿Tienes la imagen de Gemini? Súbela aquí:</p>
              <label style="display:block;width:100%;padding:10px;border-radius:10px;border:1px dashed rgba(255,255,255,.15);background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);font-size:12px;text-align:center;cursor:pointer">
                🖼️ Subir imagen
                <input type="file" accept="image/*" onchange="attachImage('${kidId}',event)" style="display:none">
              </label>
            </div>
          </div>`
        :`<div class="card-back" onclick="flipReveal('${kidId}')">
            <div class="back-emoji">${kid.emoji}</div>
            <div class="back-lbl">toca para revelar</div>
          </div>
          <div class="card-info">
            <div class="ci-name">¡Carta lista!</div>
            <div class="ci-desc">Toca para verla</div>
          </div>`
      }
    </div>
    ${isRev
      ?`<button class="btn" style="background:${kid.grad}" onclick="saveCard('${kidId}')">💾 Guardar en colección</button>`
      :`<button class="btn" style="background:${kid.grad}" onclick="flipReveal('${kidId}')">✨ Revelar carta</button>`
    }`;
}

function copyGeminiPrompt(kidId){
  const el=document.getElementById('gprompt-'+kidId);
  if(!el)return;
  navigator.clipboard.writeText(el.textContent).then(()=>{
    const btn=el.nextElementSibling;
    if(btn){btn.textContent='✅ ¡Copiado!';setTimeout(()=>{btn.textContent='📋 Copiar prompt';},2000);}
  }).catch(()=>{
    const r=document.createRange();r.selectNode(el);
    window.getSelection().removeAllRanges();window.getSelection().addRange(r);
  });
}

function attachImage(kidId,event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    if(revealCard)revealCard.image=e.target.result;
    revealed[kidId]=true;
    const area=document.getElementById('ea-'+kidId);
    if(area)renderReveal(kidId,area);
  };
  reader.readAsDataURL(file);
}

function flipReveal(kidId){revealed[kidId]=true;const a=document.getElementById('ea-'+kidId);if(a)renderReveal(kidId,a);}

function saveCard(kidId){
  const ks=getKS(kidId),score=pending.score,tier=getTier(score),card=revealCard;
  const tk=todayKey(),ds=new Date().toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  ks.collection.unshift({...card,score,tier:tier.name,tierColor:tier.color,tierGrad:tier.grad,tierCls:tier.cls,date:ds});
  const yd=new Date();yd.setDate(yd.getDate()-1);
  const yk=yd.getFullYear()+'-'+(yd.getMonth()+1)+'-'+yd.getDate();
  ks.streak=score===5&&ks.evals[yk]?.score===5?ks.streak+1:(score===5?1:0);
  ks.maxStreak=Math.max(ks.maxStreak,ks.streak);
  ks.totalPoints=(ks.totalPoints||0)+score;
  ks.evals[tk]={score};
  saveKS(kidId,ks);delete ans[kidId];pending=null;revealCard=null;
  renderKid(kidId);
}

function renderCol(){
  const c=document.getElementById('sc-col');
  let h='<p class="stitle" style="margin-bottom:14px">Álbum de cartas</p>';
  KIDS.forEach(kid=>{
    const ks=getKS(kid.id),cards=ks.collection;
    h+=`<div style="margin-bottom:22px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <div style="width:28px;height:28px;border-radius:50%;background:${kid.avatarBg};display:flex;align-items:center;justify-content:center;font-size:14px">${kid.emoji}</div>
        <span style="font-weight:800;font-size:15px">${kid.name}</span>
        <span style="font-size:11px;color:rgba(255,255,255,.25)">${cards.length} carta${cards.length!==1?'s':''}</span>
      </div>
      ${cards.length===0?`<div class="empty">¡Evalúa a ${kid.name} para conseguir su primera carta!</div>`
        :`<div class="cgrid">${cards.map(c=>`
          <div class="cc-item ${c.tierCls||''}" style="border-color:${c.tierColor}">
            <div class="cc-art" style="background:${c.tierGrad}">
              ${c.image
                ?`<img src="${c.image}" style="width:100%;height:100%;object-fit:cover;display:block">`
                :`<div class="cc-art-inner">
                  <div class="cc-art-emoji">${c.emoji}</div>
                  <div class="cc-art-name" style="color:${c.tierColor}">${c.name}</div>
                </div>`
              }
            </div>
            <div class="cc-info">
              <div class="cc-tier" style="color:${c.tierColor}">${c.tier}</div>
              <div class="cc-sub" style="color:rgba(255,255,255,.5)">${c.subtitle||''}</div>
              <div class="cc-date">${c.date} · ${c.score}/5 · ${THEME_LABELS[c.theme]||''}</div>
            </div>
          </div>`).join('')}</div>`
      }
    </div>`;
  });
  c.innerHTML=h;
}
init();
</script>
